version: "3.8"

services:
  sepharstudios:
    image: manimasaun/sepharstudios:latest
    pull_policy: always
    restart: always
    ports:
      - "3000"
    networks:
      - dokploy-network
    depends_on:
      - minio
      - ollama
    environment:
      # Server config
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - ORIGIN=https://sepharstudios.com
      
      # Database
      - DATABASE_URL=postgresql://mayowa:hotdbforsepharstudios2026@213.136.92.11:6060/sepharstudios
      
      # Better Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://sepharstudios.com
      - BETTER_API_URL=https://sepharstudios.com/api/auth

      # Redis (Dokploy-managed instance — used for OTP + rate-limit)
      - REDIS_URL=${REDIS_URL}
      
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      
      # MinIO
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-sephar-uploads}
      
      # Encoder Orchestrator
      - ORCHESTRATOR_BASE_URL=${ORCHESTRATOR_BASE_URL}
      - ORCHESTRATOR_API_SECRET=${ORCHESTRATOR_API_SECRET}

      # Encoder MinIO
      - ENCODER_MINIO_ENDPOINT=${ENCODER_MINIO_ENDPOINT}
      - ENCODER_MINIO_PORT=${ENCODER_MINIO_PORT:-443}
      - ENCODER_MINIO_USE_SSL=${ENCODER_MINIO_USE_SSL:-true}
      - ENCODER_MINIO_ACCESS_KEY=${ENCODER_MINIO_ACCESS_KEY}
      - ENCODER_MINIO_SECRET_KEY=${ENCODER_MINIO_SECRET_KEY}
      - ENCODER_INPUT_BUCKET=${ENCODER_INPUT_BUCKET:-encoder-input}
      - PUBLIC_ENCODER_MINIO_URL=${PUBLIC_ENCODER_MINIO_URL}

      # Encoder API (internal)
      - ENCODER_API_URL=${ENCODER_API_URL:-http://encoder-api:3000}

      # Bunny CDN
      - BUNNY_CDN_HOST=${BUNNY_CDN_HOST:-video.sepharstudios.com}
      - BUNNY_SECRET_KEY=${BUNNY_SECRET_KEY}

      # Backend auth
      - SEPHAR_BACKEND_TOKEN=${SEPHAR_BACKEND_TOKEN}

      # Webhooks
      - EMAIL_WEBHOOK=${EMAIL_WEBHOOK}
      - BODY_SIZE_LIMIT=10485760

      # ── AI — Dual-Model Hybrid ────────────────────────────────────────────────
      #
      # TWO OLLAMA MODELS, TWO JOBS:
      #
      #   CHAT MODEL  (Gemma 4)  → companion chat, scene insights, narration
      #   AGENT MODEL (Hermes 3) → tagging, moderation, token scoring, NFT metadata
      #
      # Pull both after first deploy:
      #   docker exec -it sephar-ollama ollama pull gemma4:12b
      #   docker exec -it sephar-ollama ollama pull hermes3:8b
      #
      # RAM guide (both models running):
      #   hermes3:8b + gemma4:12b  → ~18GB  (recommended, 24GB VPS)
      #   hermes3:8b + gemma4:2b   → ~11GB  (budget 16GB VPS)

      # Ollama — docker service name is 'ollama', port 11434
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-gemma4:12b}
      - OLLAMA_AGENT_MODEL=${OLLAMA_AGENT_MODEL:-hermes3:8b}

      # OpenRouter — cloud fallback + high-value tasks (get key at https://openrouter.ai/keys)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-google/gemma-2-27b-it}
      - OPENROUTER_AGENT_MODEL=${OPENROUTER_AGENT_MODEL:-nousresearch/hermes-3-llama-3.1-405b:extended}
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sepharstudios.rule=Host(`sepharstudios.com`)"
      - "traefik.http.routers.sepharstudios.entrypoints=websecure"
      - "traefik.http.routers.sepharstudios.tls.certresolver=letsencrypt"
      - "traefik.http.services.sepharstudios.loadbalancer.server.port=3000"
      
      # www redirect
      - "traefik.http.routers.sepharstudios-www.rule=Host(`www.sepharstudios.com`)"
      - "traefik.http.routers.sepharstudios-www.entrypoints=websecure"
      - "traefik.http.routers.sepharstudios-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sepharstudios-www.middlewares=sepharstudios-www-redirect"
      - "traefik.http.middlewares.sepharstudios-www-redirect.redirectregex.regex=^https://www\\.sepharstudios\\.com/(.*)"
      - "traefik.http.middlewares.sepharstudios-www-redirect.redirectregex.replacement=https://sepharstudios.com/$${1}"
      - "traefik.http.middlewares.sepharstudios-www-redirect.redirectregex.permanent=true"

      # Admin subdomain
      - "traefik.http.routers.sepharstudios-admin.rule=Host(`admin.sepharstudios.com`)"
      - "traefik.http.routers.sepharstudios-admin.entrypoints=websecure"
      - "traefik.http.routers.sepharstudios-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sepharstudios-admin.priority=10"

      # Creator subdomains (with and without 's')
      - "traefik.http.routers.sepharstudios-creators.rule=Host(`creators.sepharstudios.com`) || Host(`creators.sepharstudios.com`)"
      - "traefik.http.routers.sepharstudios-creators.entrypoints=websecure"
      - "traefik.http.routers.sepharstudios-creators.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sepharstudios-creators.priority=10"

  # ── Ollama — Local AI Engine ─────────────────────────────────────────────────
  # Runs TWO models:
  #   gemma4  → companion chat, scene insights, platform narration
  #   hermes3 → structured JSON (tagging, moderation, scoring, NFT metadata)
  #
  # After first deploy, pull both via SSH:
  #   docker exec -it sephar-ollama ollama pull gemma4:12b
  #   docker exec -it sephar-ollama ollama pull hermes3:8b
  #
  # GPU: uncomment the deploy block below if your VPS has NVIDIA GPU
  ollama:
    image: ollama/ollama:latest
    container_name: sephar-ollama
    restart: always
    networks:
      - dokploy-network
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MinIO Service
  minio:
    image: minio/minio:latest
    container_name: sephar-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dokploy-network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-console.rule=Host(`minio.sepharstudios.com`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      - "traefik.http.routers.minio-api.rule=Host(`s3.sepharstudios.com`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"

volumes:
  minio-data:
    driver: local
  ollama-models:
    driver: local

networks:
  dokploy-network:
    external: true
