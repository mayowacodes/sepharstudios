version: "3.8"

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26
    container_name: sephar-minio-dev
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-dev-data:/data
    command: server /data --console-address ":9001"

  # Local Redis for dev — backs OTP store + rate-limit buckets.
  # Production uses the Dokploy-managed Redis at 213.136.92.11:4076.
  redis:
    image: redis:7-alpine
    container_name: sephar-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes

volumes:
  minio-dev-data:
  redis-dev-data:
