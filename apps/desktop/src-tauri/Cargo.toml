[package]
name = "sephar-desktop"
version = "1.0.1"
description = "Sephar Studios desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The shell is a thin host around the WebView — optimise for a small installer
# rather than for compute that isn't happening in Rust anyway.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
