<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sephar Studios</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0c10" />
    <!-- Favicons. All three rel="icon" sizes point to the same flame PNG to
         keep the brand consistent across address-bar, bookmark, tab thumbnail
         and Android home-screen contexts. The order matters: browsers pick the
         best size match, falling back to the last entry if nothing fits.
         Cache-bust query (?v=3) when changing the source image. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-alone-sepharstudios-bgless.png?v=3" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-alone-sepharstudios-bgless.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-alone-sepharstudios-bgless.png?v=3" />
    <link rel="icon" type="image/png" sizes="any" href="/logo-alone-sepharstudios-bgless.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-alone-sepharstudios-bgless.png?v=3" />
    <link rel="shortcut icon" href="/logo-alone-sepharstudios-bgless.png?v=3" />
    %sveltekit.head%
    <meta name="apple-mobile-web-app-title" content="Sephar Studios" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
    <!--
      Site-wide structured data. Organization + WebSite (with SearchAction)
      are the minimum Google expects for a sitelinks search box. Per-page
      schemas (VideoObject on /watch, Person on /creators/[id]) are emitted
      from those pages via <svelte:head>.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://sepharstudios.com/#organization",
            "name": "Sephar Studios",
            "url": "https://sepharstudios.com",
            "logo": "https://sepharstudios.com/logo-alone-sepharstudios.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://sepharstudios.com/#website",
            "name": "Sephar Studios",
            "url": "https://sepharstudios.com",
            "description": "Stream faith-based movies, shows, documentaries, and kids content.",
            "publisher": { "@id": "https://sepharstudios.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://sepharstudios.com/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Openpanel — product analytics. Auto-tracks page views; we fire
         explicit server-side events from $lib/server/analytics.ts. The
         clientId is public-safe. Set via PUBLIC_OPENPANEL_CLIENT_ID env. -->
    <script>
      (function () {
        var clientId = '%sveltekit.env.PUBLIC_OPENPANEL_CLIENT_ID%';
        if (!clientId || clientId.indexOf('%') === 0) return;
        var s = document.createElement('script');
        s.src = 'https://openpanel.dev/op1.js';
        s.defer = true;
        s.setAttribute('data-client-id', clientId);
        s.setAttribute('data-track-screen-views', 'true');
        s.setAttribute('data-track-outgoing-links', 'true');
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" data-sveltekit-reload>
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
