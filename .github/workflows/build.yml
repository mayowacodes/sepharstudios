# One push, three shipping targets.
#
#   docker  → the adapter-node server image (what Dokploy deploys)
#   android → the Capacitor APK/AAB, from the adapter-static SPA
#   desktop → the Tauri installers, from the same SPA
#
# android and desktop both consume the SAME `build-static` artifact, produced
# once by the `spa` job. Building it once rather than per-platform guarantees
# the APK and the desktop app are byte-identical applications, and saves the
# ~3min SvelteKit build on every matrix leg.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Which deployment the native bundles talk to. They have no origin of their
  # own, so this is compiled in — see apps/web/vite.config.ts.
  PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN || 'https://sepharstudios.com' }}

jobs:
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sepharstudios/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  spa:
    name: static SPA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # --linker=hoisted for the same reason the Dockerfile uses it: Bun 1.3+
      # defaults to isolated workspace installs, whose symlinks don't survive
      # being relocated.
      - run: bun install --frozen-lockfile --linker=hoisted

      # SvelteKit reads $env/dynamic/private during the build, so these must be
      # present even though nothing connects. Same dummy values as the Dockerfile.
      - name: Build SPA
        working-directory: apps/web
        env:
          BUILD_TARGET: static
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          MINIO_ENDPOINT: localhost
          MINIO_PORT: '9000'
          MINIO_ACCESS_KEY: dummyaccesskey123
          MINIO_SECRET_KEY: dummysecretkey123
          MINIO_USE_SSL: 'false'
          MINIO_BUCKET: dummy-bucket
          BETTER_AUTH_SECRET: dummy-secret-key-for-build-minimum-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          EMAIL_WEBHOOK: https://email
          BODY_SIZE_LIMIT: '10485760'
        run: bun run build:static

      - uses: actions/upload-artifact@v4
        with:
          name: spa-bundle
          path: apps/web/build-static
          retention-days: 7

  android:
    name: android apk
    needs: spa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - run: bun install --frozen-lockfile --linker=hoisted

      # Drop the SPA exactly where capacitor.config.json's webDir points.
      - uses: actions/download-artifact@v4
        with:
          name: spa-bundle
          path: apps/web/build-static

      - name: Sync web assets into the Android project
        working-directory: apps/mobile
        run: bun run sync

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # Release signing needs a keystore. Skipped until the secrets exist so the
      # pipeline is green from day one rather than red pending a key upload.
      - name: Assemble release AAB
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        working-directory: apps/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/mobile/android/app/build/outputs/apk/**/*.apk
            apps/mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.os }})
    needs: spa
    strategy:
      fail-fast: false
      matrix:
        # Tauri cannot cross-compile the WebView host — each OS builds its own.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri's Linux target links against WebKitGTK and libsoup; the runner
      # image doesn't carry them.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev

      - run: bun install --frozen-lockfile --linker=hoisted

      - uses: actions/download-artifact@v4
        with:
          name: spa-bundle
          path: apps/web/build-static

      - name: Build desktop app
        working-directory: apps/desktop
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
